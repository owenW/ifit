<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pocket Commander - 腰旗橄榄球四分卫养成</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;overflow:hidden;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;color:#e0e0e0;touch-action:none;user-select:none}
canvas#c3d{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);z-index:20;display:none}
.hs{font-size:20px;font-weight:bold}.hs .y{color:#4fc3f7}.hs .o{color:#ef5350}
.hi{font-size:13px;color:#aaa;text-align:center}.hd{font-size:15px;color:#fdd835;font-weight:bold}
.pnl{position:fixed;background:rgba(10,14,26,.96);border:1px solid rgba(255,255,255,.08);border-radius:16px;backdrop-filter:blur(12px);box-shadow:0 8px 32px rgba(0,0,0,.6);padding:20px;display:none;z-index:30;overflow-y:auto}
.pnl.ctr{top:50%;left:50%;transform:translate(-50%,-50%);max-width:92vw;max-height:92vh}
.pnl.btm{bottom:0;left:0;right:0;border-radius:16px 16px 0 0;max-height:60vh}
.pnl.on{display:block}
.pnl h2{font-size:20px;margin-bottom:10px;color:#f9a825;text-align:center}
.pnl h3{font-size:14px;margin:10px 0 6px;color:#bbb}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;margin:8px 0}
.cd{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s}
.cd:hover{border-color:#f9a825;transform:translateY(-2px)}.cd.sel{border-color:#f9a825;background:rgba(249,168,37,.12)}
.cd .ic{font-size:26px;margin-bottom:4px}.cd .nm{font-size:14px;font-weight:bold}.cd .ds{font-size:11px;color:#888;margin-top:3px}
.tg{display:inline-block;font-size:9px;padding:2px 5px;border-radius:4px;margin:1px}
.tg.bt{background:rgba(67,160,71,.25);color:#81c784}.tg.wk{background:rgba(229,57,53,.25);color:#ef9a9a}
.tg.sc{border:1px solid #42a5f5;color:#42a5f5}.tg.sh{border:1px solid #ffa726;color:#ffa726}.tg.sb{border:1px solid #ef5350;color:#ef5350}
.btn{display:inline-block;padding:12px 28px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;transition:all .15s;font-family:inherit}
.btn-p{background:#f9a825;color:#0a0e1a}.btn-p:hover{background:#fbc02d;transform:scale(1.03)}
.btn-s{background:rgba(255,255,255,.08);color:#ccc}.btn-s:hover{background:rgba(255,255,255,.12)}
.btn-b{display:block;width:100%;text-align:center;margin-top:10px}
.dg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.dc{background:rgba(229,57,53,.08);border:2px solid rgba(229,57,53,.15);border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:all .2s}
.dc:hover{border-color:#ef5350}.dc.sel{border-color:#ef5350;background:rgba(229,57,53,.2)}
.dc .ic{font-size:22px}.dc .nm{font-size:13px;font-weight:bold;margin-top:3px}.dc .ds{font-size:10px;color:#999;margin-top:3px}
.ss{background:rgba(255,255,255,.03);border-radius:10px;padding:12px;margin:8px 0}
.ro{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.rs{width:44px;height:44px;border-radius:50%;border:2px dashed rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;cursor:pointer;transition:all .2s}
.rs.fl{border-style:solid;border-color:#4fc3f7;background:rgba(79,195,247,.12);color:#4fc3f7}
.ra{color:#555;font-size:16px}
#slog{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:12px 28px;border-radius:10px;font-size:15px;font-weight:bold;text-align:center;z-index:25;display:none;min-width:220px;max-width:90vw;line-height:1.5}
#slog .detail{font-size:12px;color:#aaa;font-weight:normal;margin-top:4px}
#spd{position:fixed;bottom:12px;right:16px;z-index:25;display:none}
#spd button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#ccc;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;margin-left:3px}
#spd button.a{background:#f9a825;color:#000}
#ttl{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;background:radial-gradient(ellipse at center,#0d1b2e,#0a0e1a 70%)}
#ttl h1{font-size:40px;color:#f9a825;text-shadow:0 0 30px rgba(249,168,37,.3)}
#ttl h1 span{color:#fff}
#ttl .sub{color:#888;font-size:14px;margin:8px 0 24px}
.rush-info{background:rgba(255,165,0,.1);border:1px solid rgba(255,165,0,.3);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:12px;color:#ffa726}
.coverage-detail{font-size:12px;color:#aaa;margin-top:6px;line-height:1.6;text-align:left}
.coverage-detail .open{color:#43a047}.coverage-detail .covered{color:#ef5350}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fadeIn .25s ease-out}
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="hud"><div class="hs"><span class="y">YOU 0</span></div><div><div class="hd">1st & Goal</div><div class="hi">Q1</div></div><div class="hs"><span class="o">OPP 0</span></div></div>
<div id="slog"></div>
<div id="spd"><button onclick="setSS(1)" class="a">1x</button><button onclick="setSS(2)">2x</button><button onclick="setSS(4)">4x</button></div>
<div id="ttl"><div style="font-size:56px;margin-bottom:8px">🏈</div><h1>POCKET <span>COMMANDER</span></h1><div class="sub">腰旗橄榄球 · 四分卫养成 · Roguelike</div><button class="btn btn-p" onclick="startGame()" style="font-size:18px;padding:14px 44px">开始游戏</button><div style="margin-top:16px;color:#555;font-size:12px">5v5 腰旗橄榄球 · 无护具 · 拔旗代替擒抱</div></div>
<div id="pp" class="pnl btm"></div>
<div id="dp" class="pnl ctr" style="width:440px"></div>
<div id="rp" class="pnl ctr" style="width:420px;text-align:center"></div>
<div id="sp" class="pnl ctr" style="width:520px"></div>
<div id="mp" class="pnl ctr" style="width:420px"></div>
<div id="gp" class="pnl ctr" style="width:440px;text-align:center"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
